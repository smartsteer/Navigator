name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy
        run: ./gradlew :composeApp:desktopTest
      - name: Budowa APK
        run: ./gradlew :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: navigator-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  windows:
    name: Windows (instalator)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowa instalatora MSI
        run: ./gradlew :composeApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: navigator-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
