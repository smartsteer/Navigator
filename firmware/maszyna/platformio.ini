; Firmware płytki Maszyna (ESP32-WROOM-32E). Budowa: pio run   (plik: .pio/build/maszyna/firmware.bin)
; Wgrywanie przez USB-C (CH340C, auto-reset): pio run -t upload
[env:maszyna]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
; Bluetooth Classic + Arduino nie mieści się w domyślnej partycji 1,2 MB
board_build.partitions = huge_app.csv
